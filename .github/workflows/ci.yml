# CI for the assessexpert app code. The outer repo is a thin wrapper
# that pins the inner repo as a submodule, but the inner repo lives on
# the SAME GitHub remote at a different branch (main vs. master), and
# submodule cloning from inside Actions has been flaky as a result. So
# this workflow does the simpler thing: check out the inner repo's
# main branch directly and build there.
#
# Trade-off: if a master push bumps the submodule pointer to an OLDER
# inner commit, CI still tests the latest main HEAD — not what was
# pointed at. In practice every bump tracks main HEAD, so this is fine.
# If you ever need to verify a specific submodule SHA, run the same
# commands locally against that commit.
#
# What CI checks: backend NestJS build compiles + frontend TypeScript
# type-check passes. Migration drift is gated by deploy.sh on the VPS;
# CI deliberately does not hit a real database.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout inner repo (main branch)
        uses: actions/checkout@v4
        with:
          repository: orbittrainingpoint-a11y/assessexpert
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Skip postinstall scripts: Puppeteer's Chromium download is only
      # needed on the VPS for PDF rendering, not for compilation.
      #
      # `npm install` instead of `npm ci` — CI hit lock-file drift on
      # @emnapi transitive deps (2026-08). Real fix is to regenerate
      # the lock file locally and commit; until then `install` heals
      # the drift and still installs the same package versions from
      # package.json ranges.
      - name: Install deps
        run: npm install --no-audit --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portal
    steps:
      - name: Checkout inner repo (main branch)
        uses: actions/checkout@v4
        with:
          repository: orbittrainingpoint-a11y/assessexpert
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json

      # Same drift-tolerant install pattern as backend-build above.
      - name: Install deps
        run: npm install --no-audit --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
