# CI for the assessexpert submodule. The outer repo is mostly a thin
# wrapper around the submodule, so the meaningful checks are: does
# the backend's NestJS build still compile, and does the frontend's
# TypeScript still type-check?
#
# We deliberately do NOT run prisma migrate or hit a real database —
# CI's job is to catch compile breaks before merge, not to validate
# migrations against a live DB. Migration drift is gated by the
# deploy script (backend/scripts/deploy.sh) which refuses to ship a
# divergent schema.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessexpert/backend
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assessexpert/backend/package-lock.json

      # We need Prisma client generated before nest build, otherwise
      # @prisma/client imports fail. Skipping postinstall scripts in
      # CI keeps things fast — we only need the client, not Puppeteer
      # downloads or any other heavy postinstalls.
      - name: Install deps
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessexpert/frontend/portal
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assessexpert/frontend/portal/package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
