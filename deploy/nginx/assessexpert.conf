# /etc/nginx/sites-available/assessexpert.conf
#
# Reverse-proxy layout for AssessExpert on a single VPS:
#
#   Public ──HTTPS──> Nginx :443 ─┬─ /api/*       → NestJS  :4000
#                                 ├─ /socket.io/* → NestJS  :4000  (WebSocket)
#                                 ├─ /uploads/*   → NestJS  :4000  (static)
#                                 └─ /*           → Next.js :3000
#
# Certbot's `--nginx` installer will inject the TLS block on first run
# and the http:80 vhost below is left in place so it can complete the
# ACME http-01 challenge and later 301 → https.

# ── Upstream tunables ────────────────────────────────────────────────
# Big client_max_body_size covers reference-photo captures + 5 MB
# recording chunks + practical-task file uploads. Nothing legitimate
# should ever be larger than this.
client_max_body_size 25M;

# WebSocket upgrade map — reused by every `location` that proxies to
# NestJS. Empty when the client isn't asking for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP :80 — ACME + permanent redirect ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name assessexpert.com www.assessexpert.com;

    # Let certbot answer challenges here even after the vhost gets its
    # TLS block. Everything else 301s.
    location /.well-known/acme-challenge/ {
        root /var/www/html/certbot;
    }

    location / {
        return 301 https://assessexpert.com$request_uri;
    }
}

# ── HTTPS :443 — the real vhost ──────────────────────────────────────
# Note: certbot's --nginx installer inserts the `listen 443 ssl`,
# `ssl_certificate*`, and `ssl_dhparam` lines automatically. Keep the
# `server_name`, `root`, and `location` blocks as-is.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assessexpert.com www.assessexpert.com;

    # certbot will fill these in after `certbot --nginx …` runs.
    # ssl_certificate     /etc/letsencrypt/live/assessexpert.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/assessexpert.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────
    # HSTS: once you're happy the cert is renewing cleanly, bump to
    # 31536000 (1y) and add `preload`. For the first week keep it
    # short so a botched cert doesn't lock you out for a year.
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOTE: the Next.js portal ships its own strict CSP via middleware
    # (frontend/portal/lib/proxy.ts). Do NOT add a duplicate CSP here —
    # it would collide with the app-level one and refuse to load
    # MediaPipe / TURN / Sentry.

    # ── NestJS backend — REST API ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        # Reasonable buffers for chunked recording uploads (5MB caps
        # are set on the upload endpoint itself; Nginx just streams).
        proxy_request_buffering off;
    }

    # ── NestJS backend — Socket.IO / WebSocket gateway ────────────────
    # Proctor rooms, exam status, and the participant switchboard all
    # ride Socket.IO here. Needs the `Upgrade` + `Connection` dance.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long-lived: don't cut open sockets mid-exam.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ── NestJS backend — /uploads static (recordings, reference photos) ─
    location /uploads/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Recording streams can be large — keep timeouts generous.
        proxy_read_timeout 600;
    }

    # ── Next.js portal — everything else ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Next.js server actions / hot reload use Upgrade.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300;
    }

    # ── Cache Next.js immutable chunks aggressively at the edge ───────
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 30d;
        # Chunk filenames carry a content hash — safe to cache forever.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Static brand assets served by Next.js /public ─────────────────
    location /brand/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── gzip ──────────────────────────────────────────────────────────
    # brotli would be nicer but nginx-extras isn't standard; gzip is
    # what everyone gets from `apt install nginx`.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    access_log /var/log/nginx/assessexpert-access.log;
    error_log  /var/log/nginx/assessexpert-error.log warn;
}
