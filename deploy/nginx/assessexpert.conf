# /etc/nginx/sites-available/assessexpert.conf
#
# Reverse-proxy layout for AssessExpert on a single VPS:
#
#   Public ──HTTP(S)──> Nginx ─┬─ /api/*       → NestJS  :4000
#                              ├─ /socket.io/* → NestJS  :4000  (WebSocket)
#                              ├─ /uploads/*   → NestJS  :4000  (static)
#                              └─ /*           → Next.js :3000
#
# This file ships only the :80 vhost. When you run
#
#     certbot --nginx -d assessexpert.com -d www.assessexpert.com --redirect
#
# Certbot's nginx installer automatically:
#   - Injects a matching :443 server block with the correct
#     ssl_certificate / ssl_certificate_key / ssl_dhparam lines
#   - Rewrites the :80 block to 301 → https
#   - Sets up its own systemd renewal timer
#
# So we don't hand-author the :443 block here — pre-declaring
# `listen 443 ssl` without a cert breaks `nginx -t` and refuses to
# reload the config.

# ── Upstream tunables ────────────────────────────────────────────────
# Big client_max_body_size covers reference-photo captures + 5 MB
# recording chunks + practical-task file uploads. Nothing legitimate
# should ever be larger than this.
client_max_body_size 25M;

# WebSocket upgrade map — reused by every `location` that proxies to
# NestJS. Empty when the client isn't asking for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP :80 ─────────────────────────────────────────────────────────
# Certbot rewrites this block to redirect to :443 after it runs.
server {
    listen 80;
    listen [::]:80;
    server_name assessexpert.com www.assessexpert.com;

    # ACME http-01 challenges (renewals). Left in place explicitly so
    # certbot renew never breaks even if the redirect ever regresses.
    location /.well-known/acme-challenge/ {
        root /var/www/html/certbot;
    }

    # ── Security headers ──────────────────────────────────────────────
    # HSTS: keep off until HTTPS is on. Certbot will add it when it
    # rewrites this block into the :443 vhost.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOTE: the Next.js portal ships its own strict CSP via middleware
    # (frontend/portal/lib/proxy.ts). Do NOT add a duplicate CSP here.

    # ── NestJS backend — REST API ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_request_buffering off;
    }

    # ── NestJS backend — Socket.IO / WebSocket gateway ────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ── NestJS backend — /uploads static (recordings, reference photos) ─
    location /uploads/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 600;
    }

    # ── Next.js portal — everything else ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300;
    }

    # ── Cache Next.js immutable chunks aggressively at the edge ───────
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Static brand assets served by Next.js /public ─────────────────
    location /brand/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    access_log /var/log/nginx/assessexpert-access.log;
    error_log  /var/log/nginx/assessexpert-error.log warn;
}
