version: "3.9"

# Self-hosted LiveKit SFU for assessexpert.
#
# Run on the live server:
#   cd deploy/livekit
#   cp livekit.yaml.example livekit.yaml   # edit api_key + secret + domain
#   docker compose up -d
#
# Required open ports on the host (configure in your firewall/security-group):
#   7880/TCP    — main signalling WebSocket (proxy this via nginx as wss://livekit.yourdomain.com)
#   7881/TCP    — TCP fallback for ICE
#   7882/UDP    — TURN/UDP fallback
#   50000-60000/UDP — RTC media ports (range — must all be open)
#
# After it starts, set these env vars on the NestJS backend (.env):
#   LIVEKIT_API_KEY=<the api_key from livekit.yaml>
#   LIVEKIT_API_SECRET=<the api_secret from livekit.yaml>
#   LIVEKIT_WS_URL=wss://livekit.yourdomain.com
# And on the Next.js frontend (.env.production):
#   NEXT_PUBLIC_LIVEKIT_URL=wss://livekit.yourdomain.com

services:
  livekit:
    image: livekit/livekit-server:v1.7.2
    restart: unless-stopped
    network_mode: host          # host networking is REQUIRED for the UDP port range
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - GODEBUG=netdns=go

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --port 6379 --bind 127.0.0.1
